<footer class="bg-dark text-light py-4">
  <div class="container">
    <div class="row g-4 align-items-center">
      <!-- Logo Column -->
      <div class="col-md-4 text-center text-md-start">
        <a href="javascript:void(0);" class="d-inline-block mb-3">
          <img src="assets/images/Logo-white.png" alt="Logo" class="img-fluid">
        </a>
      </div>

      <!-- Contact Info Column -->
      <div class="col-md-4 text-center">
        <h5 class="fw-bold mb-3">{{ 'FOOTER.CONTACTS' | translate }}</h5>
        <a href="mailto:{{email}}" class="text-light text-decoration-none d-inline-block mb-2 hover-opacity">
          <i class="bi bi-envelope-fill me-2"></i>{{email}}
        </a>
        <a [href]="'HERO.BUTTON-LINK' | translate" target="_blank" rel="noopener noreferrer"
          class="text-light text-decoration-none d-inline-block hover-opacity">
          <i class="bi bi-file-earmark-person-fill me-2"></i>{{ 'MENU.CV' | translate }}
        </a>
      </div>

      <!-- Social Links Column -->
      <div class="col-md-4 text-center text-md-end">
        <div class="social-links mb-3">
          <a href="https://www.linkedin.com/in/serjio-santana-632870271/" target="_blank" rel="noopener noreferrer"
            aria-label="LinkedIn" class="text-light me-4 fs-5 hover-opacity">
            <i class="bi bi-linkedin"></i>
          </a>
          <a href="https://github.com/SerSantana1" target="_blank" rel="noopener noreferrer"
            aria-label="GitHub" class="text-light fs-5 hover-opacity">
            <i class="bi bi-github"></i>
          </a>
        </div>
        <div class="copyright small">
          © {{currentYear}} SS - {{ 'FOOTER.RIGHTS' | translate }}
        </div>
      </div>
    </div>
  </div>
</footer>
